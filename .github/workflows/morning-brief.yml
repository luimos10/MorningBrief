name: Morning Market Brief

# Disparo confiable y puntual via servicio cron EXTERNO (cron-job.org) que llama
# a la API de GitHub con workflow_dispatch a las ~8:45 America/New_York (DST lo
# resuelve el servicio externo). Ya NO usamos el scheduler de GitHub porque es
# best-effort: disparaba con horas de retraso o descartaba el run, y el guard de
# ventana horaria terminaba salteando el envio (job en verde, brief sin enviar).
on:
  workflow_dispatch:        # disparado por el cron externo y tambien a mano

concurrency:
  group: morning-brief
  cancel-in-progress: false

permissions:
  contents: write           # para commitear el brief de vuelta

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate & deliver brief
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWSAPI_KEY:         ${{ secrets.NEWSAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --no-browser --fresh

      - name: Commit brief for next-day continuity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/brief_*.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "brief: $(date -u +%F) [skip ci]"
          git push
